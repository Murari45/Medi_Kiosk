name: medikiosk_ai
description: "MediKiosk AI - Multilingual Voice-Enabled Clinical Pre-Intake Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing & DI
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  get_it: ^7.7.0

  # Local Database & Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2

  # Voice & Speech
  flutter_tts: ^4.1.0
  speech_to_text: ^7.4.0

  # Charts & Visualization
  fl_chart: ^0.68.0

  # Documents, Camera & PDF
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # UI, Fonts & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
